
name: Free Phone Market Alerts

on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 13-21 * * 1-5'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a test message to Telegram'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: phone-market-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out scanner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore previous alert history
        uses: actions/cache@v4
        with:
          path: alerts.db
          key: alert-db-${{ github.run_id }}
          restore-keys: |
            alert-db-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check setups and send free Telegram alerts
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_FEED: iex
          TOP_ACTIVE: '0'
          WATCHLIST: SPY,QQQ,IWM,DIA,NVDA,TSLA,AMD,AMZN,PLTR,HOOD,AAPL,MSFT,META,GOOGL,AVGO,MU,SMCI,CRWD,COIN,MSTR,NFLX,SOFI,SHOP,UBER
          MIN_RVOL: '1.3'
          COOLDOWN_MINUTES: '45'
        shell: bash
        run: |
          if [[ "${{ inputs.test_alert }}" == "true" ]]; then
            python agent.py --test-alert
          else
            python agent.py --once
          fi
