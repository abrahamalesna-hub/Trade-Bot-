
name: Swing Trade Alerts

on:
  schedule:
    # Runs after regular NYSE market close
    - cron: '17 23 * * 1-5'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send Telegram test only (no market data)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: swing-trading-alerts
  cancel-in-progress: false

jobs:
  scan_swing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out agent
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore previous swing alerts to prevent duplicates
        uses: actions/cache@v4
        with:
          path: swing_alerts.db
          key: swing-db-${{ github.run_id }}
          restore-keys: |
            swing-db-

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Check swing setups and send Telegram alerts
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_FEED: iex
          WATCHLIST: 'SPY,QQQ,IWM,DIA,NVDA,TSLA,AMD,AMZN,PLTR,HOOD,AAPL,MSFT,META,GOOGL,AVGO,MU,SMCI,CRWD,COIN,MSTR,NFLX,SOFI,SHOP,UBER'
        shell: bash
        run: |
          if [[ '${{ inputs.test_alert }}' == 'true' ]]; then
            python swing_agent.py --test-alert
          else
            python swing_agent.py --once
          fi
